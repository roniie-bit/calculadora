<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10131d" />
    <meta name="description" content="Calculadora básica, rápida y accesible para operaciones cotidianas." />
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="calculator" aria-label="Calculadora">
      <header class="topbar">
        <span class="brand-mark" aria-hidden="true">+</span>
        <div>
          <p class="eyebrow">HERRAMIENTA</p>
          <h1>Calculadora</h1>
        </div>
        <span class="status" aria-label="Lista para usar"></span>
      </header>

      <section class="display" aria-live="polite" aria-atomic="true">
        <p class="expression" id="expression">&nbsp;</p>
        <output class="result" id="result">0</output>
      </section>

      <section class="keypad" aria-label="Teclado de la calculadora">
        <button class="key utility" data-action="clear" aria-label="Borrar todo">AC</button>
        <button class="key utility" data-action="sign" aria-label="Cambiar signo">+/−</button>
        <button class="key utility" data-action="percent" aria-label="Porcentaje">%</button>
        <button class="key operator" data-operator="÷" aria-label="Dividir">÷</button>

        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
        <button class="key operator" data-operator="×" aria-label="Multiplicar">×</button>

        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
        <button class="key operator" data-operator="−" aria-label="Restar">−</button>

        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
        <button class="key operator" data-operator="+" aria-label="Sumar">+</button>

        <button class="key zero" data-digit="0">0</button>
        <button class="key" data-action="decimal" aria-label="Decimal">.</button>
        <button class="key equals" data-action="equals" aria-label="Calcular">=</button>
      </section>
      <p class="hint">También puedes usar el teclado</p>
    </main>
  </body>
</html>
